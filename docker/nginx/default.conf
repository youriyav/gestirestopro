# =============================================================================
# Bantou-Food Frontend - Nginx Configuration
# =============================================================================
# Optimized for Angular SPA with:
# - Gzip compression
# - Caching for static assets
# - SPA routing (all routes -> index.html)
# - Security headers
# - API proxying to backend
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------------------
    # Gzip Compression
    # -----------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # -----------------------------------------------------------------------------
    # Security Headers
    # -----------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -----------------------------------------------------------------------------
    # Static Assets Caching (JS, CSS, images)
    # -----------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -----------------------------------------------------------------------------
    # API Proxying to Backend
    # NestJS backend runs as the "backend" service on the same Docker network
    # (port 3333, see backend/Dockerfile). Kept under a dedicated /api/ prefix
    # rather than proxying by resource name, because several backend resource
    # paths (restaurants, prospects, additions) are identical to real Angular
    # app routes — without a prefix nginx can't tell a page load of
    # /restaurants from an API call to /restaurants. The trailing slash on
    # both `location` and `proxy_pass` strips the /api prefix before
    # forwarding, since backend routes have none (e.g. /auth/login).
    # -----------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------------
    # Angular SPA Routing
    # All routes should serve index.html (Angular handles routing)
    # -----------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Disable caching for index.html (always get fresh version)
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }

    # -----------------------------------------------------------------------------
    # Health Check Endpoint
    # -----------------------------------------------------------------------------
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # -----------------------------------------------------------------------------
    # Deny access to hidden files
    # -----------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

