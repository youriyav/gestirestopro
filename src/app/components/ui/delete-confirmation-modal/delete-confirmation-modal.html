@if (isOpen()) {
<div
  class="fixed inset-0 bg-gray-50/65 flex items-center justify-center z-50 p-4"
  (click)="onBackdropClick($event)"
>
  <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
    <!-- Modal Header -->
    <div class="p-6 border-b border-gray-200">
      <div class="flex items-center gap-3">
        <div class="p-3 bg-red-100 rounded-full">
          <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
        </div>
        <h2 class="text-xl font-bold text-gray-900">{{ title() }}</h2>
      </div>
    </div>

    <!-- Modal Body -->
    <div class="p-6">
      <p class="text-gray-600">{{ message() }}</p>
    </div>

    <!-- Modal Footer -->
    <div class="flex justify-end gap-3 p-6 border-t border-gray-200">
      <button
        type="button"
        (click)="onCancel()"
        class="px-6 py-2.5 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 font-medium transition-colors"
        [disabled]="isDeleting()"
      >
        Annuler
      </button>
      <button
        type="button"
        (click)="onConfirm()"
        class="px-6 py-2.5 bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="isDeleting()"
      >
        @if (isDeleting()) {
          <span class="flex items-center gap-2">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
            Suppression...
          </span>
        } @else {
          Supprimer
        }
      </button>
    </div>
  </div>
</div>
}
