<div [class]="cardBackgroundClass()" class="p-6 rounded-2xl 
shadow-lg relative overflow-hidden card-metrics">
  <div class="flex justify-between items-start mb-4">
    <h3 [class]="titleClass() " class=" min-h-16">{{ label() }}</h3>
    <button [class]="buttonClass()" class="p-2 rounded-full transition-colors">
      <svg class="w-4 h-4" [class]="iconColor()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
      </svg>
    </button>
  </div>

  <div [class]="valueClass()">{{ metricValue() }}</div>
  <div class="flex items-center gap-2  min-h-12" [class]="trackingTextClass()">
    @if (showTracking() && trackingValue() !== undefined) {
    <span [class]="trackingBadgeClass()">
      @if (isIncreased()) {
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
      </svg>
      } @else {
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
      </svg>
      }
      {{ trackingValue() }}
    </span>
    <span [class.opacity-90]="isPrimary()">{{ trackingText() }}</span>
    
    }
      </div>

  
</div>
