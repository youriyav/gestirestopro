
<!-- Main modal -->
<div
class="flex overflow-y-auto
overflow-x-hidden fixed top-0
right-0 left-0 z-50 justify-center
items-center w-full md:inset-0
h-full backdrop-blur-sm bg-gray-50/30"
(click)="closeModal()">
    <div class="relative p-4 w-full max-w-md max-h-full"
         (click)="$event.stopPropagation()">
        <!-- Modal content -->
        <div class="relative bg-white
        border border-gray-200 rounded-xl shadow-lg p-4 md:p-6">
            <!-- Modal header -->
            <div class="flex items-center justify-between border-b border-gray-200 pb-4 md:pb-5">
                <h3 class="text-lg font-medium text-gray-900">
                    Réinitialiser le mot de passe
                </h3>
                <button type="button"
                class="text-gray-400 bg-transparent
                hover:bg-gray-200 hover:text-gray-900
                rounded-lg text-sm w-9 h-9 ms-auto inline-flex
                justify-center items-center"
                (click)="closeModal()">
                    <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/></svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            <!-- Modal body -->
            <form class="pt-4 md:pt-6">
                <div class="mb-4">
                    <label for="email" class="block mb-2.5 text-sm
                    font-medium text-gray-900">Votre email</label>
                    <input type="email" id="email"
                    class="bg-gray-50
                    border border-gray-300 text-gray-900
                    text-sm rounded-xl focus:ring-primary
                    focus:border-primary block w-full px-3 py-2.5"
                    placeholder="example@company.com" required />
                </div>
                <div class="w-full">
                    <app-primary-button class="w-full"
                      [label]="'Réinitialiser'"
                      (onClick)="handleReset($event)">
                    </app-primary-button>
                </div>
            </form>
        </div>
    </div>
</div>
