<header
  class="fixed left-0 right-0 z-30
   bg-white border border-menu-cream-2
   transition-all duration-300"
  [class.lg:left-64]="!isSidebarCollapsed()"
  [class.lg:left-20]="isSidebarCollapsed()"
  [class.top-0]="!authService.isImpersonating()"
  [class.top-10]="authService.isImpersonating()"
  (click)="$event.stopPropagation()"
>
  <div class="flex items-center justify-between px-4 lg:px-6 h-16">
    <!-- Left side: Home icon + Breadcrumb -->
    <div class="flex items-center gap-3">
      <button
        (click)="navigateToOverview()"
        class="flex items-center gap-2 text-gray-700 hover:text-[#031C3F] transition-colors"
        aria-label="Vue d'ensemble"
      >
        <!--app-home-icon size="20" strokeWidth="2"></app-home-icon-->
      </button>

      <!-- Breadcrumb -->
      <nav class="flex items-center gap-2" aria-label="Breadcrumb">
        @for (crumb of breadcrumbs(); track crumb.route; let last = $last) {
        <div class="flex items-center gap-2">
          @if (!last) { 
          <button
            (click)="navigateToBreadcrumb(crumb.route)"
            class="text-sm font-medium text-gray-600 hover:text-[#031C3F] transition-colors uppercase"
          >
            {{ crumb.label }}
          </button>
          <span class="text-gray-400">/</span>
          } @else {
          <span class="text-sm font-medium text-gray-900 uppercase">
            {{ crumb.label }}
          </span>
          }
        </div>
        }
      </nav>
    </div>

    <!-- Right side: Language, Notifications, User Profile -->
    <!-- Language Dropdown -->

    <div class="flex items-center gap-4">
      <!-- Language Selector -->
      <!--div class="relative header-menu">
        <button
          (click)="toggleLanguageMenu()"

      <!-- Notifications -->
      <div class="relative header-menu">
        <button
          (click)="toggleNotificationsMenu()"
          class="relative p-2 text-gray-600 hover:text-gray-900 transition-colors"
          aria-label="Notifications"
        >
          <!--app-bell-icon size="20" strokeWidth="2"></app-bell-icon-->
          @if (notificationCount() > 0) {
          <span
            class="absolute top-0 right-0 flex items-center justify-center w-5 h-5 text-xs font-semibold text-white bg-orange-500 rounded-full"
          >
            {{ notificationCount() }}
          </span>
          }
        </button>

        <!-- Notifications Dropdown -->
        @if (showNotificationsMenu()) {
        <div
          class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50 max-h-96 overflow-y-auto"
        >
          <div class="px-4 py-2 border-b border-gray-200">
            <h3 class="text-sm font-semibold text-gray-900">Notifications</h3>
          </div>
          <div class="px-4 py-8 text-center text-gray-500 text-sm">
            Aucune notification
          </div>
        </div>
        }
      </div>

      <!-- User Profile -->
      <div class="relative header-menu">
        <button
          (click)="toggleUserMenu()"
          class="flex items-center gap-3 px-2 py-1 hover:bg-gray-50 rounded-lg transition-colors"
          aria-label="Menu utilisateur"
        >
          <div class="relative">
            <div
              class="w-10 h-10 rounded-full bg-menu-cassis flex items-center justify-center text-white font-semibold text-sm"
            >
              {{ userInitials() }}
            </div>
            <span
              class="absolute bottom-0 right-0 w-3 h-3 bg-menu-success border-2 border-white rounded-full"
            ></span>
          </div>
          <div class="hidden md:block text-left">
            <p class="text-sm font-medium text-gray-900">
              {{ userDisplayName() }}
            </p>
            <p class="text-xs text-gray-500">{{ userRole() }}</p>
          </div>
        </button>

        <!-- User Menu Dropdown -->
        @if (showUserMenu()) {
        <div
          class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50"
        >
          <div class="px-4 py-2 border-b border-gray-200">
            <p class="text-sm font-medium text-gray-900">
              {{ userDisplayName() }}
            </p>
            <p class="text-xs text-gray-500">{{ userEmail() }}</p>
          </div>
          <button
            (click)="onLogout()"
            class="w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-red-50 transition-colors"
          >
            Déconnexion
          </button>
        </div>
        }
      </div>
    </div>
  </div>
</header>
